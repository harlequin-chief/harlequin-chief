<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="HARLEQUIN — an independent framework for voluntary cooperation among sovereign individuals">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe6cf"/>
      <stop offset="0.5" stop-color="#d4af6a"/>
      <stop offset="1" stop-color="#b9974f"/>
    </linearGradient>
    <radialGradient id="auraCrimson" cx="50%" cy="10%" r="60%">
      <stop offset="0" stop-color="#9b2335" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#9b2335" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auraGold" cx="50%" cy="94%" r="65%">
      <stop offset="0" stop-color="#d4af6a" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#d4af6a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ground + aura -->
  <rect width="1200" height="470" fill="#0a0a0f"/>
  <rect width="1200" height="470" fill="url(#auraCrimson)"/>
  <rect width="1200" height="470" fill="url(#auraGold)"/>

  <!-- the mark: a diamond of four facets, one colour per suit (♦ gold · ♥ crimson · ♠ ink · ♣ gold-soft) -->
  <g filter="url(#glow)">
    <polygon points="600,40 645,98 600,98" fill="#d4af6a"/>
    <polygon points="600,40 555,98 600,98" fill="#b9974f"/>
    <polygon points="600,156 645,98 600,98" fill="#9b2335"/>
    <polygon points="600,156 555,98 600,98" fill="#e9e6df"/>
    <polygon points="600,40 645,98 600,156 555,98" fill="none" stroke="#d4af6a" stroke-opacity="0.55" stroke-width="1.5"/>
  </g>

  <!-- wordmark -->
  <text x="600" y="290" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', Cambria, serif"
        font-size="96" font-weight="700" letter-spacing="14"
        fill="url(#gold)" filter="url(#glow)">HARLEQUIN</text>

  <!-- the four suits, canonical order ♦ ♥ ♠ ♣ -->
  <text x="600" y="352" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="32" letter-spacing="20">
    <tspan fill="#d4af6a">&#9830;</tspan><tspan fill="#0a0a0f">.</tspan><tspan fill="#9b2335">&#9829;</tspan><tspan fill="#0a0a0f">.</tspan><tspan fill="#e9e6df">&#9824;</tspan><tspan fill="#0a0a0f">.</tspan><tspan fill="#b9974f">&#9827;</tspan>
  </text>

  <!-- divider -->
  <line x1="440" y1="392" x2="760" y2="392" stroke="#d4af6a" stroke-opacity="0.22" stroke-width="1"/>

  <!-- tagline -->
  <text x="600" y="430" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-style="italic"
        font-size="22" letter-spacing="1.5" fill="#8f8a7e">Freedom and responsibility, not imposition.</text>
</svg>
