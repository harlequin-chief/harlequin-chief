<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="HARLEQUIN — an independent framework for voluntary cooperation among sovereign individuals">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe6cf"/>
      <stop offset="0.5" stop-color="#d4af6a"/>
      <stop offset="1" stop-color="#b9974f"/>
    </linearGradient>
    <radialGradient id="auraCrimson" cx="50%" cy="14%" r="60%">
      <stop offset="0" stop-color="#9b2335" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#9b2335" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auraGold" cx="50%" cy="92%" r="65%">
      <stop offset="0" stop-color="#d4af6a" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#d4af6a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ground -->
  <rect width="1200" height="380" fill="#0a0a0f"/>
  <rect width="1200" height="380" fill="url(#auraCrimson)"/>
  <rect width="1200" height="380" fill="url(#auraGold)"/>

  <!-- wordmark -->
  <text x="600" y="170" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', Cambria, serif"
        font-size="104" font-weight="700" letter-spacing="14"
        fill="url(#gold)" filter="url(#glow)">HARLEQUIN</text>

  <!-- the four suits, canonical order ♦ ♥ ♠ ♣ -->
  <text x="600" y="244" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="34" letter-spacing="22">
    <tspan fill="#d4af6a">&#9830;</tspan><tspan fill="#0a0a0f">.</tspan><tspan fill="#9b2335">&#9829;</tspan><tspan fill="#0a0a0f">.</tspan><tspan fill="#e9e6df">&#9824;</tspan><tspan fill="#0a0a0f">.</tspan><tspan fill="#b9974f">&#9827;</tspan>
  </text>

  <!-- divider -->
  <line x1="430" y1="288" x2="770" y2="288" stroke="#d4af6a" stroke-opacity="0.22" stroke-width="1"/>

  <!-- tagline -->
  <text x="600" y="326" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-style="italic"
        font-size="23" letter-spacing="1.5" fill="#8f8a7e">Freedom and responsibility, not imposition.</text>
</svg>
